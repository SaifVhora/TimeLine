/* works out what this device is allowed to do */
function computeAuth(db, me) {
  const a = db.access;
  if (!me || !me.key) return { state: "loading", role: "guest", registered: false, ...ROLE_PRESET.viewer };
  if (a.ownerKey && a.ownerKey === me.key)
    return { state: "in", role: "owner", registered: true, create: true, edit: true, delete: true, manage: true };
  const m = a.members.find((x) => x.key === me.key);
  if (m) return { state: "in", role: m.role, registered: true, ...ROLE_PRESET[m.role], ...(m.perms || {}) };
  if (a.denied.includes(me.key)) return { state: "denied", role: "guest", registered: false, ...ROLE_PRESET.viewer };
  if (a.pending.some((p) => p.key === me.key)) return { state: "waiting", role: "guest", registered: false, ...ROLE_PRESET.viewer };
  return { state: "guest", role: "guest", registered: false, ...ROLE_PRESET.viewer };
}

/* keeps cards and bands from ever sitting on top of each other */

/* cards alternate above/below the line, spilling outward when it gets busy */
function layoutCards(items, xOf, x2Of, cardW) {
  const sides = { top: [], bot: [] };
  const order = [["top", 0], ["bot", 0], ["top", 1], ["bot", 1], ["top", 2], ["bot", 2], ["top", 3], ["bot", 3]];
  return items.map((ev) => {
    const x = xOf(ev), x2 = x2Of(ev);
    let side = "top", lane = 0, placed = false;
    for (const [sd, ln] of order) {
      if ((sides[sd][ln] === undefined ? -1e9 : sides[sd][ln]) <= x - cardW) { side = sd; lane = ln; placed = true; break; }
    }
    if (!placed) { side = sides.top.length <= sides.bot.length ? "top" : "bot"; lane = sides[side].length; }
    sides[side][lane] = x + cardW;
    return { ev, x, x2, side, lane };

}

/* multi-day bands stack outward from the line, alternating sides */
function layoutBands(nodes, minWidth) {
  const laneEnds = [];
  const OFF = [-11, 11, -19, 19, -27, 27, -35, 35];
  return nodes.filter((n) => n.x2 - n.x >= (minWidth || 16)).map((n) => {
    let lane = laneEnds.findIndex((e) => e <= n.x - 6);
    if (lane === -1) { lane = laneEnds.length; laneEnds.push(0); }
    laneEnds[lane] = n.x2;
    return { ...n, off: OFF[lane % OFF.length] };
  });
}

/* How tall the stage must be, and where the line sits on it.

   Cards stack outward in lanes, so a busy stretch needs more room than the
   window has. The stage used to be locked to the window height with overflow
   hidden, which silently cut off any card in a deep lane — you could not
   scroll to it or reach it at all. Now the stage grows and the view scrolls.

   Returns { stageH, lineY, scrollY, needTop, needBot } in pixels. */
function fitStage(nodes, opts) {
  const { H, arm, cardH, gap = 14, pad = 20, empty = 80 } = opts;
  const deepest = (side) => nodes.reduce((m, n) => (n.side === side ? Math.max(m, n.lane) : m), -1);
  const need = (side) => { const d = deepest(side); return d < 0 ? empty : arm + (d + 1) * (cardH + gap) + pad; };

  const lineY = scrollY ? needTop : Math.min(Math.max(Math.round(H * 0.52), needTop), H - needBot);
  return { stageH, lineY, scrollY, needTop, needBot };
}

        ...(e.participants || []), ...(e.winners || []).map((w) => w.name)].join(" ").toLowerCase().includes(q))
      .sort((a, b) => evStart(a) - evStart(b));
  }, [events, query, typeFilter]);

  const saveEvent = (ev) => {
    const exists = !!p.db.events[ev.id];
    p.apply((d) => {
      d.events[ev.id] = { ...(d.events[ev.id] || {}), ...ev, serverId: p.server.id, deleted: false,
        updatedAt: nowISO(), updatedBy: p.me.name };
      return d;
    }, exists ? "Event updated" : "Event added");
    setEditing(null);
  };

  const deleteEvent = (id) => {
    p.apply((d) => {
      if (d.events[id]) d.events[id] = { ...d.events[id], deleted: true, updatedAt: nowISO(), updatedBy: p.me.name };
      return d;
    }, "Event deleted");
    setConfirmDel(null); setDetail(null);

        h("input", { value: query, onChange: (e) => setQuery(e.target.value), placeholder: "Search the line",
          style: { width: "100%", background: T.field, border: "1px solid " + T.hair, borderRadius: 10, color: T.text,
            fontFamily: BODY, fontSize: 14, outline: "none", padding: "8px 12px 8px 34px" } })),
      h("div", { className: "relative" },
        h("select", { value: typeFilter, onChange: (e) => setTypeFilter(e.target.value),
          style: { background: T.field, border: "1px solid " + T.hair, borderRadius: 10, color: T.text,
            fontFamily: BODY, fontSize: 14, outline: "none", appearance: "none", padding: "8px 30px 8px 12px" } },
          h("option", { value: "all" }, "All types"),
          TYPES.map((t) => h("option", { key: t.id, value: t.id }, t.label))),
        h(ChevronDown, { size: 13, className: "absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none", style: { color: T.muted } })),
      h("div", { className: "ml-auto flex items-center gap-1.5" },
        h(Btn, { size: "sm", onClick: () => setZoom((z) => Math.max(0, z - 1)), disabled: zoom === 0 }, h(ZoomOut, { size: 13 })),
        h(Btn, { size: "sm", onClick: () => setZoom((z) => Math.min(2, z + 1)), disabled: zoom === 2 }, h(ZoomIn, { size: 13 })),
        p.auth.create ? h(Btn, { tone: "solid", size: "sm", onClick: () => setEditing(blankEvent()) },
          h(Plus, { size: 14 }), h("span", { className: "hidden sm:inline" }, "New event")) : null)),

    h(Line, { events: visible, now: p.now, zoom: ZOOMS[zoom], onOpen: setDetail, empty: events.length === 0,
      canCreate: p.auth.create, onAdd: () => setEditing(blankEvent()), serverName: p.server.name, ping: p.ping }),

    h(Detail, { ev: detail, now: p.now, perms: p.auth, names, onClose: () => setDetail(null),
      onEdit: (e) => { setDetail(null); setEditing(e); }, onDelete: setConfirmDel, onCopy: (t) => copy(t, p.ping) }),

    h(Editor, { ev: editing, onClose: () => setEditing(null), onSave: saveEvent, names }),

    h(Modal, { open: !!confirmDel, onClose: () => setConfirmDel(null) },
      h("div", { className: "p-6" },
        h("div", { style: { fontFamily: DISPLAY, fontSize: 19 } }, "Delete this event?"),
        h("p", { className: "mt-2 text-sm", style: { color: T.body } },
          "\u201C" + (confirmDel ? confirmDel.title : "") + "\u201D leaves the line for everyone on the next sync. There's no undo."),
        h("div", { className: "mt-5 flex gap-2" },
          h(Btn, { tone: "danger", full: true, onClick: () => deleteEvent(confirmDel.id) }, "Delete event"),
          h(Btn, { full: true, onClick: () => setConfirmDel(null) }, "Keep it")))));

__ex.ServerTimeline = ServerTimeline;
});

  __req("src/app.js");
})();

</script>
