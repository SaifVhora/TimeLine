<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#04060D" />
<title>Events Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script>window.React || document.write('<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>')</script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script>window.ReactDOM || document.write('<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>')</script>
<style>
  html, body, #root { height: 100%; margin: 0; }
  #boot-msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #04060D; color: #78849F; font: 12px ui-monospace, monospace; letter-spacing: .2em;
    text-align: center; padding: 24px; z-index: 0; }
</style>
</head>
<body>
<div id="boot-msg">LOADING THE TIMELINE…</div>
<div id="root" style="position:relative;z-index:1"></div>

<script>
  /* anything that breaks shows up on screen instead of a white page */
  function etFail(msg) {
    var el = document.getElementById("boot-msg");
    if (el) { el.textContent = msg + " — screenshot this if it doesn't clear."; el.style.color = "#FF7285"; }
  }
  window.addEventListener("error", function (e) {
    if (e && e.target && e.target.tagName === "SCRIPT") { etFail("A script failed to load: " + (e.target.src || "unknown")); return; }
    etFail("Something failed to load: " + ((e && e.message) || "unknown error"));
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    etFail("Something failed: " + ((e && e.reason && e.reason.message) || "unknown"));
  });
  setTimeout(function () {
    var el = document.getElementById("boot-msg");
    if (el && el.textContent.indexOf("LOADING") === 0) etFail("The app didn't start");
  }, 9000);
</script>

<script type="module" src="./src/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js").catch(function () {}); });
  }
</script>
</body>
</html>
